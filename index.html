<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>协同编辑示例</title>
  <style>
    html,
    body {
      height: 100%;
      overflow: hidden;
      background-color: var(--affine-white-90);
      transition: background-color 0.3s;
    }
  </style>
</head>

<body>
  <input id="name" type="text" placeholder="用户名" />
  <button id="connect">连接</button>
  <!-- 新建/保存/提交 操作 -->
  <button id="btn-new" style="margin-left:8px;">新建</button>
  <button id="btn-save" style="margin-left:4px;">保存</button>
  <button id="btn-submit" style="margin-left:4px;">提交</button>
  <!-- 语言切换 -->
  <label style="margin-left:8px;">语言：</label>
  <select id="lang" style="margin-right:12px;">
    <option value="zh-CN">中文</option>
    <option value="zh-CN-bilingual">中文（双语）</option>
    <option value="en-US">English</option>
  </select>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
